[package]
name = "alystria-desktop"
version = "2.0.0-rc.0"
description = "Minimal-privilege desktop broker for AI Video Tutorial Generator"
authors = ["AI Video Tutorial Generator contributors"]
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Explicitly opt a locally built, self-contained test executable into the
# unsigned-but-hash-pinned portable runtime path. Production builds omit it.
portable-debug-runtime = []

[lib]
name = "alystria_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "alystria-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
ed25519-dalek = "2"
fs2 = "0.4"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
parking_lot = "0.12"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.1"
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.37"
tauri = { version = "2", features = ["protocol-asset"] }
uuid = { version = "1", features = ["serde", "v7"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

# Portable debug builds verify the complete runtime before starting its worker.
# Keep every hash check while avoiding unoptimized SHA-256's startup penalty.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
