<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Scattered blue light reaches the viewer from many directions</title><desc id="desc">A compact left-side diagram shows blue paths from several air molecules converging on a viewer's eye. The right side is reserved for the presenter.</desc>
  <defs><linearGradient id="atmosphere" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCEEFF"/><stop offset=".58" stop-color="#B8D8F3"/><stop offset="1" stop-color="#F7F4EA"/></linearGradient><linearGradient id="ground" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C8DDD2"/><stop offset="1" stop-color="#AFCBC4"/></linearGradient><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#3E70D1"/></marker><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#14243D" flood-opacity=".15"/></filter></defs>
  <rect width="1920" height="1080" fill="url(#atmosphere)"/><path d="M0 858C330 785 700 915 1090 820V1080H0Z" fill="url(#ground)"/><path d="M1090 0H1920V1080H1090Z" fill="#F3F1EA" opacity=".73"/><path d="M1090 86V994" stroke="#D4DCE5" stroke-width="2"/><text x="1510" y="148" text-anchor="middle" fill="#686D80" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">AI VIDEO TUTORIAL GENERATOR</text><path d="M1342 178H1678" stroke="#C9CED8" stroke-width="2"/>
  <text x="96" y="104" fill="#245FAF" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="4.5">WHAT YOUR EYES RECEIVE</text><text x="96" y="176" fill="#151827" font-family="Arial, sans-serif" font-size="54" font-weight="800">Scattered blue arrives</text><text x="96" y="237" fill="#151827" font-family="Arial, sans-serif" font-size="54" font-weight="800">from across the sky.</text>
  <circle cx="166" cy="438" r="61" fill="#F3C45D"/><circle cx="148" cy="421" r="20" fill="#FFF5C2" opacity=".72"/><g fill="#FFFFFF" stroke="#168F88" stroke-width="3" opacity=".9"><circle cx="414" cy="366" r="18"/><circle cx="630" cy="320" r="16"/><circle cx="834" cy="394" r="18"/><circle cx="472" cy="604" r="17"/><circle cx="700" cy="574" r="18"/></g><g fill="none" stroke="#3E70D1" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)" opacity=".92"><path d="M430 371C586 407 731 516 885 667"/><path d="M646 327C756 402 830 511 890 671"/><path d="M849 411C891 472 905 555 898 670"/><path d="M489 607C643 603 772 625 886 682"/><path d="M718 581C796 606 851 638 891 684"/></g><g transform="translate(930 704)" filter="url(#shadow)"><circle r="70" fill="#FFFFFF" stroke="#151827" stroke-width="6"/><path d="M-43 0C-15-35 19-35 45 0C18 35-15 35-43 0Z" fill="#F7F8FC" stroke="#151827" stroke-width="6"/><circle cx="2" r="17" fill="#3E70D1"/><circle cx="2" r="7" fill="#151827"/></g><text x="930" y="813" text-anchor="middle" fill="#245FAF" font-family="Arial, sans-serif" font-size="21" font-weight="800">YOUR EYE</text>
