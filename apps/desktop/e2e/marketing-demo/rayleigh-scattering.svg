<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Shorter wavelengths scatter more strongly</title><desc id="desc">Within a compact left-side diagram, white sunlight meets an air molecule. Several blue paths scatter outward, while a strong red path continues and a faint red path scatters.</desc>
  <defs><linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F9F8F2"/><stop offset="1" stop-color="#E8F1F6"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#1A2940" flood-opacity=".13"/></filter><marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#3E70D1"/></marker><marker id="arrow-red" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#C74E54"/></marker><marker id="arrow-white" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#FFFFFF"/></marker></defs>
  <rect width="1920" height="1080" fill="url(#sky)"/><rect x="54" y="52" width="1018" height="832" rx="42" fill="#FFFFFF" opacity=".72" stroke="#D7DFE9" stroke-width="2"/><path d="M1090 0H1920V1080H1090Z" fill="#F4F2EC" opacity=".72"/><path d="M1090 86V994" stroke="#D5DDE7" stroke-width="2"/><text x="1510" y="148" text-anchor="middle" fill="#686D80" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">AI VIDEO TUTORIAL GENERATOR</text><path d="M1342 178H1678" stroke="#C9CED8" stroke-width="2"/>
  <text x="96" y="118" fill="#168F88" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="4.5">RAYLEIGH SCATTERING</text><text x="96" y="190" fill="#151827" font-family="Arial, sans-serif" font-size="54" font-weight="800">Air molecules scatter blue</text><text x="96" y="251" fill="#151827" font-family="Arial, sans-serif" font-size="54" font-weight="800">more strongly than red.</text>
  <g transform="translate(92 572)"><g filter="url(#shadow)"><circle cx="76" cy="0" r="62" fill="#F2BD50"/><circle cx="57" cy="-18" r="21" fill="#FFF2B5" opacity=".78"/></g><path d="M142-42H486V42H142Z" fill="#FFFFFF" opacity=".97"/><path d="M176 0H460" stroke="#FFFFFF" stroke-width="12" marker-end="url(#arrow-white)"/><text x="300" y="-70" text-anchor="middle" fill="#566078" font-family="Arial, sans-serif" font-size="21" font-weight="700">WHITE SUNLIGHT</text><g transform="translate(530 0)" filter="url(#shadow)"><circle r="44" fill="#C8D9D9" stroke="#168F88" stroke-width="5"/><circle cx="-15" cy="-9" r="7" fill="#F8FBFB"/><circle cx="15" cy="11" r="6" fill="#F8FBFB"/></g><g fill="#B8CACC" stroke="#168F88" stroke-width="2.5" opacity=".9"><circle cx="700" cy="-150" r="21"/><circle cx="752" cy="143" r="19"/><circle cx="900" cy="-91" r="22"/><circle cx="930" cy="120" r="18"/></g><g fill="none" stroke="#3E70D1" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow-blue)"><path d="M558-18C647-57 688-120 724-198"/><path d="M565 1C676 14 775 18 888 2"/><path d="M557 20C650 67 700 134 735 210"/><path d="M520-38C489-121 461-177 421-220"/></g><path d="M563 28C700 51 815 53 948 48" fill="none" stroke="#C74E54" stroke-width="11" stroke-linecap="round" marker-end="url(#arrow-red)"/><path d="M556 22C650 97 700 161 728 225" fill="none" stroke="#C74E54" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 13" opacity=".48" marker-end="url(#arrow-red)"/><rect x="610" y="-278" width="362" height="54" rx="27" fill="#EAF0FF"/><text x="791" y="-242" text-anchor="middle" fill="#245FAF" font-family="Arial, sans-serif" font-size="21" font-weight="800">BLUE SCATTERS MORE</text><rect x="610" y="248" width="340" height="76" rx="30" fill="#FBEDEF"/><text x="780" y="278" text-anchor="middle" fill="#A43B45" font-family="Arial, sans-serif" font-size="17" font-weight="800"><tspan x="780">RED SCATTERS LESS</tspan><tspan x="780" dy="23">MORE RED CONTINUES FORWARD</tspan></text></g>
  
</svg>



