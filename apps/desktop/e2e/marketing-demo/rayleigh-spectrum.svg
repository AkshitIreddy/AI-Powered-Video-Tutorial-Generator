<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Sunlight contains the visible spectrum</title><desc id="desc">A compact diagram on the left shows a warm sun sending a white beam through a prism, separating into red through violet. The right side is reserved for the presenter.</desc>
  <defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FAF8F1"/><stop offset="1" stop-color="#EEF3F7"/></linearGradient><radialGradient id="sun" cx="45%" cy="40%" r="58%"><stop offset="0" stop-color="#FFF7C8"/><stop offset=".72" stop-color="#F5C765"/><stop offset="1" stop-color="#DF922E"/></radialGradient><filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="17" flood-color="#15223A" flood-opacity=".13"/></filter></defs>
  <rect width="1920" height="1080" fill="url(#paper)"/><path d="M0 874C330 790 672 950 1090 850V1080H0Z" fill="#DDE9E8"/><path d="M1090 0H1920V1080H1090Z" fill="#F5F2EB" opacity=".66"/><path d="M1090 86V994" stroke="#D9DFE7" stroke-width="2"/><circle cx="1710" cy="170" r="310" fill="#5658E8" opacity=".035"/><text x="1510" y="148" text-anchor="middle" fill="#686D80" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">AI VIDEO TUTORIAL GENERATOR</text><path d="M1342 178H1678" stroke="#C9CED8" stroke-width="2"/>
  <text x="96" y="102" fill="#168F88" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="4.5">LIGHT · FIRST PRINCIPLE</text><text x="96" y="176" fill="#151827" font-family="Arial, sans-serif" font-size="58" font-weight="800">White sunlight carries</text><text x="96" y="242" fill="#151827" font-family="Arial, sans-serif" font-size="58" font-weight="800">every visible color.</text><text x="100" y="294" fill="#566078" font-family="Arial, sans-serif" font-size="25">A prism makes the hidden spectrum visible.</text>
